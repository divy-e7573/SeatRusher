name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the newest run for a ref needs to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # No `version:` input on purpose: the action reads packageManager from the
      # root package.json so the pinned pnpm version has a single source of truth.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Install runs the `prisma generate` postinstall, so the Prisma Client is
      # already available for lint and typecheck.

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test:
    name: Tests (real Postgres + Redis)
    runs-on: ubuntu-latest

    # AGENTS.md requires integration tests to run against real infrastructure
    # rather than mocks, so the same containers used by docker-compose.yml are
    # started here as GitHub Actions service containers.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seatrush
          POSTGRES_PASSWORD: seatrush_dev_password
          POSTGRES_DB: seatrush
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U seatrush -d seatrush"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      # The API never reads secrets from a committed file; CI injects them here.
      TEST_DATABASE_URL: postgres://seatrush:seatrush_dev_password@localhost:5432/seatrush
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test database (migrate + seed isolated schema)
        run: pnpm --filter api db:test:prepare

      - name: Run tests
        run: pnpm test
